name: Verify Gate Secrets

# One-off check that the three secrets used to deploy the Runpod gate work,
# before merging. Read-only against Cloudflare. Against Runpod it reads the pod
# and sends one "stop" to a pod that is already stopped, which answers 409
# without changing anything. Runs when this file changes on the working branch,
# or by hand. Delete it once the secrets are confirmed.

on:
  push:
    branches: [claude/modest-maxwell-ry8qh2]
    paths: [.github/workflows/verify-gate-secrets.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'osamagweaa/open-seo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RUNPOD_KEY: ${{ secrets.RUNPOD_API_KEY }}
      POD_ID: jl8n558l4bwyu3
    steps:
      - name: Check the secrets
        run: |
          fail=0
          summary() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          pass() { summary "PASS  $1"; }
          miss() { summary "FAIL  $1"; fail=1; }

          for name in CF_TOKEN CF_ACCOUNT RUNPOD_KEY; do
            [ -n "${!name}" ] || miss "the secret behind $name is empty or missing"
          done
          [ "$fail" = 0 ] || exit 1

          cf() { curl -sS -o /tmp/cf.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }

          code=$(cf "/accounts/$CF_ACCOUNT/tokens/verify")
          if [ "$code" = 200 ] && [ "$(jq -r '.result.status' /tmp/cf.json)" = active ]; then
            pass "Cloudflare token is active (account token)"
          else
            code=$(cf "/user/tokens/verify")
            if [ "$code" = 200 ] && [ "$(jq -r '.result.status' /tmp/cf.json)" = active ]; then
              pass "Cloudflare token is active (user token)"
            else
              miss "Cloudflare token did not verify (HTTP $code)"
            fi
          fi

          code=$(cf "/accounts/$CF_ACCOUNT")
          if [ "$code" = 200 ]; then pass "Account ID is right and Account Settings (read) works"
          else miss "Account ID or Account Settings permission failed (HTTP $code)"; fi

          code=$(cf "/accounts/$CF_ACCOUNT/workers/scripts")
          if [ "$code" = 200 ]; then pass "Workers Scripts permission works ($(jq '.result | length' /tmp/cf.json) Workers found)"
          else miss "Workers Scripts permission failed (HTTP $code)"; fi

          code=$(cf "/accounts/$CF_ACCOUNT/storage/kv/namespaces")
          if [ "$code" = 200 ] && jq -e '.result[] | select(.title == "openseo-gate-state")' /tmp/cf.json > /dev/null; then
            pass "Workers KV Storage permission works and the gate namespace exists"
          else miss "Workers KV Storage check failed (HTTP $code)"; fi

          rp() { curl -sS -o /tmp/rp.json -w '%{http_code}' -H "Authorization: Bearer $RUNPOD_KEY" "$@"; }

          status=""
          code=$(rp "https://api.runpod.io/v2/pods/$POD_ID")
          if [ "$code" = 200 ]; then
            status=$(jq -r '.status' /tmp/rp.json)
            pass "Runpod key can read the pod (status $status)"
          else
            miss "Runpod key cannot read the pod (HTTP $code)"
          fi

          if [ "$status" = EXITED ]; then
            code=$(rp -X POST -H 'content-type: application/json' -d '{"action":"stop"}' "https://api.runpod.io/v2/pods/$POD_ID/action")
            case "$code" in
              200|409) pass "Runpod key may control the pod (HTTP $code on a harmless stop of a stopped pod)" ;;
              401|403) miss "Runpod key is read-only or lacks permission to control pods (HTTP $code)" ;;
              *) miss "Unexpected Runpod answer to the stop probe (HTTP $code)" ;;
            esac
          elif [ -n "$status" ]; then
            summary "SKIP  write probe, the pod is $status and not EXITED"
          fi

          exit "$fail"
