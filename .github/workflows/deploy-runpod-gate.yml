name: Deploy Runpod Gate

# Deploys the Cloudflare Worker in scripts/runpod-gate, the always-on front
# door that wakes the Runpod pod on a visit and stops it when idle. Manual only,
# and only from main on this repository, so deploy secrets never run branch or
# fork code. See docs/SELF_HOSTING_RUNPOD.md.
#
# Required repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts edit and
# Workers KV Storage edit), CLOUDFLARE_ACCOUNT_ID, RUNPOD_API_KEY (created in
# the Runpod console; lets the Worker start and stop the pod).

on:
  workflow_dispatch:

concurrency:
  group: deploy-runpod-gate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'osamagweaa/open-seo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        run: pnpm exec wrangler deploy -c scripts/runpod-gate/wrangler.jsonc

      - name: Set the Runpod API key
        run: printf '%s' "$RUNPOD_API_KEY" | pnpm exec wrangler secret put RUNPOD_API_KEY -c scripts/runpod-gate/wrangler.jsonc
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
